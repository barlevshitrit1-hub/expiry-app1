<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מדבקות תפוגה</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--bd:#e3e1da;--ac:#1f7a5c;--acx:#fff;
--bad:#b3261e;--badbg:#fde8e6;--warn:#8a5a00;--warnbg:#fff1d6;--ok:#1f7a5c;--okbg:#e2f3ec;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16171a;--card:#202226;--tx:#eceae4;--mut:#9a988f;--bd:#33353a;--ac:#4fc29c;--acx:#0c1f18;
--bad:#ff8a80;--badbg:#3a1f1d;--warn:#ffc766;--warnbg:#3a2d12;--ok:#6fd6b0;--okbg:#17302a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16171a;--card:#202226;--tx:#eceae4;--mut:#9a988f;--bd:#33353a;--ac:#4fc29c;--acx:#0c1f18;
--bad:#ff8a80;--badbg:#3a1f1d;--warn:#ffc766;--warnbg:#3a2d12;--ok:#6fd6b0;--okbg:#17302a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
input,select,button{font:inherit;color:var(--tx)}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--ac);color:var(--acx);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd);font-weight:400}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.bad{background:var(--badbg);color:var(--bad)}.warn{background:var(--warnbg);color:var(--warn)}.ok{background:var(--okbg);color:var(--ok)}
.name{font-weight:600}.meta{color:var(--mut);font-size:13px}
.hl{outline:2px solid var(--ac)}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;text-align:center;padding:10px;border-radius:10px;font-size:13px}
.stat b{display:block;font-size:22px}
.x{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer;padding:4px 8px}
.done .name{text-decoration:line-through;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:20px}
.f{display:grid;gap:8px}
label{font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>🏷️ מדבקות תפוגה</h1>
<p class="sub">סורקים מדבקה, מזינים תאריך, ומקבלים התראה לפני שהמוצר פג.</p>

<div class="card" id="snapbox" hidden>
  <strong>📷 צילום מוצר</strong>
  <p class="meta" style="margin:4px 0 8px">צלמו את המוצר ואת התאריך (עד 3 תמונות). Claude מזהה שם, קטגוריה ותאריך, ואתם רק מאשרים.</p>
  <label class="btn" style="display:block;text-align:center;cursor:pointer">צלם או בחר תמונה<input id="snap" type="file" accept="image/*" multiple hidden></label>
  <div class="meta" id="snapst" style="margin-top:8px" role="status"></div>
</div>

<div class="card">
  <label for="code">מדבקה (אופציונלי): קוד המדבקה, למשל A1B2C3</label>
  <div class="row"><input id="code" class="grow" placeholder="קוד מדבקה" autocomplete="off"><button class="btn" id="scan">סרוק</button></div>
</div>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" id="t-items" aria-selected="true">פריטים</button>
  <button class="tab" role="tab" id="t-shop" aria-selected="false">רשימת קניות</button>
</div>

<section id="v-items">
  <div class="stats" id="stats"></div>
  <div id="list"></div>
  <div class="card" id="form">
    <div class="f">
      <strong id="ftitle">הוספת פריט</strong>
      <div><label for="n">שם</label><input id="n" placeholder="למשל: אקמול"></div>
      <div class="row">
        <div class="grow"><label for="c">קטגוריה</label>
          <select id="c"><option>תרופות</option><option>מזווה</option><option>מקרר</option><option>תינוק</option><option>חיות מחמד</option></select></div>
        <div class="grow"><label for="d">תאריך תפוגה</label><input id="d" type="date"></div>
      </div>
      <div><label for="k">קוד מדבקה (לא חובה)</label><input id="k" placeholder="A1B2C3"></div>
      <button class="btn" id="add">שמירה</button>
    </div>
  </div>
</section>

<section id="v-shop" hidden>
  <div class="card"><div class="row"><input id="sn" class="grow" placeholder="מה לקנות?"><button class="btn" id="sadd">הוספה</button></div></div>
  <div id="slist"></div>
</section>
</main>

<script>
const KEY="expiry-proto-v1";
const day=864e5;
function iso(off){const t=new Date();t.setHours(12,0,0,0);return new Date(t.getTime()+off*day).toISOString().slice(0,10)}
let S={items:[],shop:[]};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
if(!S.items||!S.items.length&&!S._seeded){
  S={_seeded:1,shop:[],items:[
    {id:1,name:"אקמול",cat:"תרופות",exp:iso(-3),code:"A1B2C3"},
    {id:2,name:"חלב",cat:"מקרר",exp:iso(4),code:"D4E5F6"},
    {id:3,name:"שימורי תירס",cat:"מזווה",exp:iso(210),code:"G7H8J9"},
    {id:4,name:"מזון לחתול",cat:"חיות מחמד",exp:iso(25),code:""}]};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function days(e){const t=new Date();t.setHours(12,0,0,0);return Math.round((new Date(e+"T12:00:00")-t)/day)}
function status(e){const n=days(e);
  if(n<0)return{c:"bad",t:"פג תוקף לפני "+(-n)+" ימים"};
  if(n===0)return{c:"bad",t:"פג היום"};
  if(n<=7)return{c:"warn",t:"נותרו "+n+" ימים"};
  return{c:"ok",t:"נותרו "+n+" ימים"}}
function render(){
  const its=S.items.slice().sort((a,b)=>a.exp<b.exp?-1:1);
  const cnt={bad:0,warn:0,ok:0};its.forEach(i=>cnt[status(i.exp).c]++);
  $("stats").innerHTML=
   '<div class="stat bad"><b>'+cnt.bad+'</b>פג תוקף</div><div class="stat warn"><b>'+cnt.warn+'</b>עד שבוע</div><div class="stat ok"><b>'+cnt.ok+'</b>תקין</div>';
  $("list").innerHTML=its.length?its.map(i=>{const s=status(i.exp);
   return '<div class="card" id="i'+i.id+'"><div class="row"><div class="grow"><div class="name">'+esc(i.name)+'</div>'+
   '<div class="meta">'+esc(i.cat)+' · '+i.exp.split("-").reverse().join(".")+(i.code?' · '+esc(i.code):'')+'</div></div>'+
   '<span class="pill '+s.c+'">'+s.t+'</span><button class="x" data-del="'+i.id+'" aria-label="מחיקה">×</button></div>'+
   (s.c!=="ok"?'<div style="margin-top:8px"><button class="btn ghost" data-buy="'+i.id+'">הוסף לרשימת קניות</button></div>':'')+'</div>'}).join(""):'<div class="empty">אין פריטים עדיין</div>';
  $("slist").innerHTML=S.shop.length?S.shop.map(p=>
   '<div class="card '+(p.done?'done':'')+'"><div class="row"><input type="checkbox" style="width:auto" data-chk="'+p.id+'"'+(p.done?' checked':'')+'><div class="grow name">'+esc(p.name)+'</div><button class="x" data-sdel="'+p.id+'" aria-label="מחיקה">×</button></div></div>').join(""):'<div class="empty">הרשימה ריקה</div>';
}
function addShop(name){name=name.trim();if(!name||S.shop.some(p=>p.name===name&&!p.done))return;S.shop.push({id:Date.now(),name,done:false});save();render()}
$("add").onclick=()=>{
  const name=$("n").value.trim(),exp=$("d").value;
  if(!name||!exp){alert("נא למלא שם ותאריך תפוגה");return}
  S.items.push({id:Date.now(),name,cat:$("c").value,exp,code:$("k").value.trim().toUpperCase()});
  save();["n","d","k"].forEach(i=>$(i).value="");render()};
$("scan").onclick=()=>{
  const c=$("code").value.trim().toUpperCase();if(!c)return;
  const it=S.items.find(i=>i.code===c);show("items");
  if(it){const el=$("i"+it.id);el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.add("hl");setTimeout(()=>el.classList.remove("hl"),2500)}
  else{$("k").value=c;$("ftitle").textContent="מדבקה חדשה "+c+": הוסיפו את הפריט";$("form").scrollIntoView({behavior:"smooth"});$("n").focus()}};
$("sadd").onclick=()=>{addShop($("sn").value);$("sn").value=""};
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.dataset.del){S.items=S.items.filter(i=>i.id!=t.dataset.del);save();render()}
  if(t.dataset.buy){addShop(S.items.find(i=>i.id==t.dataset.buy).name);show("shop")}
  if(t.dataset.sdel){S.shop=S.shop.filter(p=>p.id!=t.dataset.sdel);save();render()}});
document.addEventListener("change",e=>{if(e.target.dataset.chk){const p=S.shop.find(p=>p.id==e.target.dataset.chk);p.done=e.target.checked;save();render()}});
function show(v){["items","shop"].forEach(x=>{$("v-"+x).hidden=x!==v;$("t-"+x).setAttribute("aria-selected",x===v)})}
$("t-items").onclick=()=>show("items");$("t-shop").onclick=()=>show("shop");
let sample=null;
(async()=>{try{if(window.claude&&claude.use)sample=await claude.use("sample");if(sample&&sample.limits){const l=await sample.limits();if(!l||!l.images)sample=null}}catch(e){sample=null}
  if(sample)$("snapbox").hidden=false})();
function shrink(f){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",.85)};
  im.onerror=()=>rej(new Error("img"));im.src=u})}
$("snap").onchange=async e=>{
  const fs=[...e.target.files].slice(0,3);e.target.value="";if(!fs.length||!sample)return;
  const st=$("snapst");st.textContent="Claude קורא את התמונה...";
  try{
    const imgs=await Promise.all(fs.map(shrink));
    const r=await sample.json("בתמונות מוצר מהבית (חזית ו/או תאריך). החזר JSON בלבד, בלי טקסט נוסף, בפורמט: {\"name\":\"שם המוצר בעברית, קצר\",\"category\":\"אחת מהאפשרויות: תרופות, מזווה, מקרר, תינוק, חיות מחמד\",\"exp\":\"YYYY-MM-DD או null\",\"note\":\"הערה קצרה אם משהו לא ברור, אחרת מחרוזת ריקה\"}. exp הוא תאריך תפוגה בלבד, לא תאריך ייצור. אם מופיעים רק חודש ושנה, השתמש ביום האחרון של החודש. אם אין תאריך קריא, exp הוא null. היום: "+iso(0),{images:imgs,modelTier:"quick"});
    if(r&&r.name)$("n").value=String(r.name).slice(0,60);
    if(r&&[...$("c").options].some(o=>o.value===r.category))$("c").value=r.category;
    if(r&&/^\d{4}-\d{2}-\d{2}$/.test(r.exp||""))$("d").value=r.exp;
    const noDate=!(r&&/^\d{4}-\d{2}-\d{2}$/.test(r.exp||""));
    st.textContent=(noDate?"לא זוהה תאריך, נא להזין ידנית. ":"זוהה. בדקו ואשרו למטה. ")+((r&&r.note)||"");
    $("ftitle").textContent="אישור פרטים";$("form").scrollIntoView({behavior:"smooth"});
  }catch(err){
    st.textContent=(err&&err.code==="not_granted")?"לא אושר שימוש ב-Claude. אפשר למלא ידנית.":"לא הצלחתי לקרוא את התמונה. אפשר למלא ידנית.";
  }};
render();
</script>
</body>
</html>
